<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Mock Interview Assistant | Built by Gaganashree A</title>

    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body, #root {
        height: 100%;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #f5f6f8;
        color: #111;
      }

      /* FOOTER */
      footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        z-index: 9999;

        /* Your image color */
        background: #0b1a2b;

        text-align: center;
        padding: 10px 0;
      }

      /* Main text */
      .footer-main {
        font-size: 14px;
        font-weight: 500;
        color: #ffffff; /* strong contrast on dark */
      }

      /* Name highlight */
      .footer-main strong {
        font-weight: 700;
        color: #ffffff;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <footer>
      <div class="footer-main">
        Built by <strong>Gaganashree A</strong> @2026 All Rights Reserved
      </div>
    </footer>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
